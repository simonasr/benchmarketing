x-bench_base: &bench_base
  build:
    context: ../../redbench
    dockerfile: Dockerfile
  volumes:
    - ../../redbench/config.yaml:/config.yaml
  restart: no
  depends_on:
    - prometheus
    - redis8
    - redis7
    - valkey

services:
  controller:
    <<: *bench_base
    command: ["--mode=controller", "--port=8081"]
    ports:
      - "8081:8081"

  worker_redis8_1:
    <<: *bench_base
    command: ["--mode=worker", "--port=8080", "--controller=http://controller:8081", "--bind-address=worker_redis8_1"]
    ports:
      - "8080:8080"
    depends_on:
      - prometheus
      - redis8
      - redis7
      - valkey
      - controller

  worker_redis7_1:
    <<: *bench_base
    command: ["--mode=worker", "--port=8080", "--controller=http://controller:8081", "--bind-address=worker_redis7_1"]
    depends_on:
      - prometheus
      - redis8
      - redis7
      - valkey
      - controller

  worker_valkey_1:
    <<: *bench_base
    command: ["--mode=worker", "--port=8080", "--controller=http://controller:8081", "--bind-address=worker_valkey_1"]
    depends_on:
      - prometheus
      - redis8
      - redis7
      - valkey
      - controller

  redis8:
    image: redis:8.0
    container_name: redis8
    ports:
      - 6379:6379
    restart: unless-stopped

  redis7:
    image: redis:7.2
    container_name: redis7
    ports:
      - 6378:6379
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8.1
    container_name: valkey
    ports:
      - 6380:6379
    restart: unless-stopped

  redis8-exporter:
    image: oliver006/redis_exporter:v1.61.0
    container_name: redis8-exporter
    environment:
      - REDIS_ADDR=redis8:6379
    ports:
      - 9121:9121
    command: ["--redis.addr=redis8:6379", "--web.listen-address=:9121"]
    depends_on:
      - redis8

  redis7-exporter:
    image: oliver006/redis_exporter:v1.61.0
    container_name: redis7-exporter
    environment:
      - REDIS_ADDR=redis7:6379
    ports:
      - 9122:9121
    command: ["--redis.addr=redis7:6379", "--web.listen-address=:9121"]
    depends_on:
      - redis7

  valkey-exporter:
    image: oliver006/redis_exporter:v1.61.0
    container_name: valkey-exporter
    environment:
      - REDIS_ADDR=valkey:6379
    ports:
      - 9123:9121
    command: ["--redis.addr=valkey:6379", "--web.listen-address=:9121"]
    depends_on:
      - valkey

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - 9090:9090
    restart: unless-stopped
    volumes:
      - ../prometheus:/etc/prometheus
      - prom_data:/prometheus
  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - 3000:3000
    restart: unless-stopped
    environment:
      - GF_DASHBOARDS_JSON_ENABLED=true
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_PATHS_DASHBOARDS=/var/lib/grafana/dashboards
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=grafana
    volumes:
      - ../grafana/dashboards:/var/lib/grafana/dashboards
      - ../grafana:/etc/grafana/provisioning/datasources
      - ../grafana/dashboard.yaml:/etc/grafana/provisioning/dashboards/main.yaml
  job_init:
    image: alpine:3.20
    container_name: job_init
    profiles: ["autostart"]
    depends_on:
      - controller
      - worker_redis8_1
      - worker_redis7_1
      - worker_valkey_1
    volumes:
      - ../../redbench/scripts/compose-start-job.sh:/compose-start-job.sh:ro
    environment:
      - CONTROLLER_URL=http://controller:8081
      - EXPECTED_WORKERS=3
      - MAX_WAIT_SECS=180
      - SLEEP_SECS=2
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache curl >/dev/null 2>&1 && /bin/sh /compose-start-job.sh"]
volumes:
  prom_data:
