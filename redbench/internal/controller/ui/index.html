<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RedBench Controller UI</title>
    <link rel="stylesheet" href="/ui/style.css">
  </head>
  <body>
    <header>
      <h1>RedBench Controller</h1>
      <nav>
        <a href="#workers">Workers</a>
        <a href="#job">Job</a>
      </nav>
    </header>
    <main>
      <section id="job" class="panel">
        <div class="panel-head">
          <h2>Job Control</h2>
          <div class="controls">
            <button type="button" id="distributeWorkers">Distribute workers</button>
            <span id="availableInfo" class="muted"></span>
          </div>
        </div>
        <form id="jobForm">
          <fieldset>
            <legend>Targets</legend>
            <div id="targets">
              <div class="target">
                <label>Redis URL
                  <input type="text" name="redisUrl" placeholder="redis://host:6379 or rediss://...">
                </label>
                <label>Cluster URL
                  <input type="text" name="redisClusterUrl" placeholder="rediss://cluster:6380 or host:port">
                </label>
                <label>Worker Count
                  <input type="number" name="workerCount" value="1" min="1">
                </label>
                <button type="button" class="removeTarget">Remove</button>
              </div>
            </div>
            <button type="button" id="addTarget">Add Target</button>
          </fieldset>

          <fieldset>
            <legend>Test Config</legend>
            <div class="grid">
              <label>Min Clients<input type="number" id="minClients" value="10" min="1"></label>
              <label>Max Clients<input type="number" id="maxClients" value="100" min="1"></label>
              <label>Stage Interval (ms)<input type="number" id="stageIntervalMs" value="1000" min="1"></label>
              <label>Request Delay (ms)<input type="number" id="requestDelayMs" value="10" min="0"></label>
              <label>Key Size<input type="number" id="keySize" value="16" min="1"></label>
              <label>Value Size<input type="number" id="valueSize" value="1024" min="1"></label>
              <label>Op Timeout (ms)<input type="number" id="operationTimeoutMs" value="250" min="1"></label>
              <label>Expiration (s)<input type="number" id="expiration" value="45" min="1"></label>
            </div>
          </fieldset>

          <div class="actions">
            <button type="submit" id="startJob">Start Job</button>
            <button type="button" id="stopJob">Stop Job</button>
            <button type="button" id="resetDefaults">Reset to defaults</button>
          </div>
        </form>

        <div id="jobStatus" class="status"></div>
      </section>

      <section id="workers" class="panel">
        <div class="panel-head">
          <h2>Workers</h2>
          <div class="controls">
            <label class="toggle">
              <input type="checkbox" id="autoRefreshToggle" checked>
              <span>Auto-refresh (1s)</span>
            </label>
            <button id="refreshWorkers">Refresh</button>
          </div>
        </div>
        <table id="workersTable">
          <thead>
            <tr>
              <th>ID</th>
              <th>Address</th>
              <th>Port</th>
              <th>Status</th>
              <th>Last Seen</th>
              <th>Current Job</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>
    </main>

    <script src="/ui/app.js"></script>
  </body>
  </html>
